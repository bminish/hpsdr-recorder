# Config file for full diversity recordings on MW
# for HPSDR hardware (ANAN-100D)
#
ip = 192.168.0.108
sample rate = 1536000
frequency = 950000
diversity = true
# DDC tuning correction in Hz. Normally 0 - the radio tunes exactly where
# asked. Only for calibrating against a known carrier.
freq_correction = 0
# Recording length in seconds. 0 (or absent) records until Ctrl+C.
# Same meaning as rsp-recorder's "streaming time" / -x.
streaming time = 0

# ADC step attenuator, 0-31 dB. Applied to both ADCs so the diversity
# channels stay matched. Measured peaks sit ~30 dB below full scale on this
# antenna, so 0 is right unless a night check says otherwise.
attenuation = 0

# RX antenna: ant1|ant2|ant3 (signal also passes the TX low-pass filters)
# or ext1|ext2|xvtr (receive-only inputs, filters bypassed).
antenna = ant1

# 24-bit samples are shifted right this many bits to fit the 16-bit file.
# 8 = never clips, ~10 of 16 bits used on this antenna.
# 4 = 24 dB more weak-signal range, clips if levels rise ~24 dB.
# The run prints peak level and any clipping at exit - use that to choose.
sample_shift = 8
output type = Linrad
output file = /home/bminish/Radio/02-IQ-files-diversity/HP_TOH_{TIMESTAMP}_{FREQKHZ}.raw
